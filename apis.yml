  detail: >-
    Onibi is a pre-release consumer game studio whose entire web presence is three static pages
    (Studio, Career, Contact) plus a nine-language marketing site for the unreleased Tomo: Endless
    Blue — the Steam page promises the game will be moddable but no modding API, SDK or developer
    documentation exists yet, and the only HTTP API on any Onibi host is /api/ on the product site,
    which its own robots.txt disallows; onibi.gg answers HTTP 200 with the same 43KB homepage for
    /openapi.json and every other probed path, so its 200s are soft-404s, while tomoendlessblue.com
    returns real 404s for all of them.
