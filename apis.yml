aid: onibi
name: Onibi
description: 'Onibi (Onibi inc.) is a video game studio founded in 2023 by Benjamin Devienne, with a
  distributed team in San Francisco, London and Bordeaux drawn from Blizzard, Riot, Ubisoft, EA and
  Rockstar. Its first title is Tomo: Endless Blue, a procedurally generated monster-taming voxel
  sandbox open world announced for Steam and funded through a Kickstarter campaign plus roughly $6.5M
  in seed capital from SeaX Ventures, Serena, Octopus Ventures and Pix Capital. Onibi is a consumer
  game studio, not an API provider: as of August 2026 the game is unreleased and the studio publishes
  no developer portal, API reference, SDK or machine-readable specification. The Steam page states an
  intent to keep the game moddable, but no modding API, tooling or documentation has been published
  yet, so there is nothing machine-readable to catalog.'
